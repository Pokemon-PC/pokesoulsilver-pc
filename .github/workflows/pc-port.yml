# Native PC port: builds the game on Windows, Linux and macOS (x86_64).
# No game data is used or produced here: the PC executable needs the player's
# own ROM at run time (see docs/pc_port/README_PC.md).
name: PC port

on:
  push:
    paths: ['src/**', 'lib/**', 'include/**', 'cmake/**', 'CMakeLists.txt', 'tools/pc_port/**', '.github/workflows/pc-port.yml']
  pull_request:
    paths: ['src/**', 'lib/**', 'include/**', 'cmake/**', 'CMakeLists.txt', 'tools/pc_port/**', '.github/workflows/pc-port.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: [SOULSILVER]   # this repository: SoulSilver (HeartGold: pokeheartgold-pc)
        name: [windows, linux, macos]
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15-intel    # Intel runner: the port targets x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.name == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (Windows, MSYS2 CLANG64)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-llvm-tools

      - name: Toolchain (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build cmake python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev

      - name: Toolchain (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DPHG_GAME_VERSION=${{ matrix.version }}

      - name: Build
        run: cmake --build build --target pokeheartgold phg_m2_selftest

      - name: Link diagnostics
        if: failure()
        run: |
          cmake --build build --target pokeheartgold > link.log 2>&1 || true
          grep -v '^\[' link.log | cut -c1-400 | grep -iE 'error|undefined|ld:|relocation|duplicate|warning' | sort | uniq -c | sort -rn | head -60

      - name: Selftest (headless, no game data)
        env:
          PHG_MUTE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: cd build && ./phg_m2_selftest --data ../files --save m2_selftest_save.bin

      - name: Package
        run: python3 tools/pc_port/package.py --build build --out dist || python tools/pc_port/package.py --build build --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-${{ matrix.version }}-PC-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/symbols
